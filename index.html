<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка...</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const queryString = decodeURIComponent(window.location.search);
            const startIndex = queryString.indexOf('[');
            
            if (startIndex !== -1) {
                try {
                    const arrayAsString = queryString.slice(startIndex);
                    const numbersArray = JSON.parse(arrayAsString);
                    if (Array.isArray(numbersArray)) {
                        numbersArray.sort((a, b) => a - b);
                        document.title = numbersArray.toString();
                    }
                } catch (error) {
                    document.title = 'Ошибка в данных';
                }
            }
        });
    </script>
</head>
<body>
    <h4>1167675</h4>
</body>
</html>
